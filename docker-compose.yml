services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: memora_dev_password
      POSTGRES_DB: memora
    ports:
      - "5432:5432"
    volumes:
      - memora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora -d memora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: memora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - memora_redis_data:/data
    command: redis-server --appendonly yes

volumes:
  memora_postgres_data:
  memora_redis_data: